name: web-shared

on:
  push:
    branches: [main, dev, rewrite/v2]
    paths: [web/**, server/main.go]
  pull_request:
    paths: [web/**, server/main.go]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "web/**/*.test.ts"
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: ./node_modules/.bin/tsc --noEmit -p userscript/tsconfig.json
        working-directory: web
      - run: ./node_modules/.bin/tsc --noEmit -p player/tsconfig.json
        working-directory: web
      - run: npm run build --workspaces
        working-directory: web
      # server/main.go cannot import TS, so appVersion duplicates VERSION:
      # fail the build if they drift apart.
      - run: |
          ts_ver=$(node -e "import('./web/shared/version.ts').then(m => console.log(m.VERSION))")
          go_ver=$(sed -n 's/^\sappVersion *= *"\(.*\)"$/\1/p' server/main.go)
          test "$ts_ver" = "$go_ver" || { echo "version drift: ts=$ts_ver go=$go_ver"; exit 1; }
