name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build --workspaces
        working-directory: web
      - run: tar -czf player-dist.tar.gz -C player/dist .
        working-directory: web
      - run: sha256sum player-dist.tar.gz | awk '{print $1}' > player-dist.tar.gz.sha256
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
      - name: build matrix
        env:
          # v2.0.5 -> 2.0.5; the TS player keeps its own -dev version,
          # /api/status simply reports whatever the binary was stamped with.
          APP_VERSION: ${{ github.ref_name }}
        run: |
          ver="${APP_VERSION#v}"
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            name="kinolink-$1-$2"
            echo "building $name ($ver)"
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags "-s -w -X main.appVersion=$ver" \
              -o "$name" .
            sha256sum "$name" | awk '{print $1}' > "$name.sha256"
          done
        working-directory: server

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            server/kinolink-*
            web/player-dist.tar.gz*
