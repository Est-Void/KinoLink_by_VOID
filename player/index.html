<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoLink by VOID</title>
    <link rel="icon" href="assets/play.png">
    <link rel="stylesheet" href="style.css?v=0.6.1">
</head>

<body>
    <div id="container">

        <header id="header">
            <button id="watched-toggle" type="button" aria-expanded="false" aria-label="Просмотренные фильмы" title="Просмотренные">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="theme-toggle" type="button" aria-expanded="false" aria-label="Темы" title="Темы">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
            <button id="phone-toggle" type="button" aria-label="Настроить на смартфоне" title="Настроить на смартфоне">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7" y="2.5" width="10" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/>
                    <path d="M11 18.5h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div id="logo">
                <img src="assets/play.png" alt="KinoLink Logo">
            </div>
            <div id="title">...</div>
        </header>

        <div id="sidebar" aria-label="Просмотренные фильмы">
            <div class="sidebar-head">
                <div class="sidebar-head-start">
                    <button id="sort-toggle" type="button" aria-label="Сменить порядок сортировки" title="Порядок сортировки">A–Z</button>
                    <span>Просмотренные</span>
                </div>
                <button class="sidebar-close" type="button" aria-label="Закрыть панель">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div id="watched-list"></div>
        </div>

        <div id="theme-sidebar" aria-label="Темы">
            <div class="sidebar-head">
                <div class="sidebar-head-start">
                    <span>Темы</span>
                </div>
                <button class="sidebar-close" type="button" aria-label="Закрыть панель">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div id="theme-list"></div>
        </div>

        <div id="content">
            <div class="loader"></div>
        </div>

        <div id="episode-bar" hidden>
            <div class="episode-group">
                <button id="season-prev" type="button" aria-label="Предыдущий сезон">−</button>
                <span id="season-label">Сезон 1</span>
                <button id="season-next" type="button" aria-label="Следующий сезон">+</button>
            </div>
            <div class="episode-group">
                <button id="episode-prev" type="button" aria-label="Предыдущая серия">−</button>
                <span id="episode-label">Серия 1</span>
                <button id="episode-next" type="button" aria-label="Следующая серия">+</button>
            </div>
            <button id="episode-next-btn" type="button">Следующая серия →</button>
        </div>

        <div id="sources" role="tablist" aria-label="Источники воспроизведения"></div>
    </div>

    <div id="background"></div>

    <div id="footer">
        <div class="caption">приятного просмотра</div>
        <a class="made-by" href="https://github.com/Est-Void" target="_blank" rel="noopener noreferrer" title="GitHub — est-Void">Made by VOID</a>
    </div>

    <script src="config.js?v=0.6.1"></script>
    <script src="utils.js?v=0.6.1"></script>
    <script src="player.js?v=0.6.1"></script>
</body>

</html>
