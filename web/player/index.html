<!DOCTYPE html>
<html lang="ru" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinoLink</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="topbar">
    <span>Designed by est-Void</span>
    <span id="version"></span>
  </div>
  <div id="background"></div>
  <div id="container">
    <header id="header">
      <button id="theme-toggle" type="button" aria-expanded="false" aria-label="Темы" title="Темы">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" />
          <path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" />
        </svg>
      </button>
      <div id="title">KinoLink</div>
    </header>
    <div id="content">
      <div class="frame" id="frame"><p id="hint">Загрузка…</p></div>
    </div>
    <div id="sources" role="tablist" aria-label="Источники воспроизведения"></div>
    <aside id="theme-sidebar" aria-label="Темы">
      <div class="sidebar-head">
        <span>Темы</span>
        <button id="theme-close" type="button" aria-label="Закрыть панель">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div id="theme-list"></div>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
