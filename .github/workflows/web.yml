name: web-shared

on:
  push:
    branches: [main, dev, rewrite/v2]
    paths: [web/**]
  pull_request:
    paths: [web/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/shared/movie.test.ts
